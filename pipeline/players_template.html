$("#fieldbox").addEventListener("click",()=>$("#tip").style.opacity=0);

/* ---------- scouting card ---------- */
function pickList(){const p=$("#pick");const sur=n=>n.replace(/\s+(Jr\.|Sr\.|II|III|IV)$/,"").split(" ").slice(-1)[0];
 p.innerHTML=D.slice().sort((a,b)=>sur(a.n).localeCompare(sur(b.n))||a.n.localeCompare(b.n)).map(d=>`<option value="${esc(d.k)}">${esc(d.n)}, ${esc(d.t)}</option>`).join("");
 p.setAttribute("aria-label",`Choose a ${cfg.one}`);p.onchange=()=>select(p.value,false)}
function card(){const d=D.find(x=>x.k===S.sel);if(!d)return;$("#pick").value=d.k;const adj=G.mode==="j",N=D.length,V=k=>fmt(k,val(d,k));
 const kp=cfg.kpi.map(([k,l],idx)=>{const v=val(d,k),a=avg(k),vs=D.map(o=>val(o,k)).filter(ok),lo=Math.min(...vs),hi=Math.max(...vs),sp=hi-lo||1;
  const extra=idx===0?`<br>${ord(rankOf(d,k))} of ${N}`:"",raw=adj&&!USAGE.has(k)?`, raw ${fmt(k,d.r[k],"r")}`:"";
  const w=ok(v)?Math.max(0,Math.min(100,(v-lo)/sp*100)):0;
  return`<div class="kpi"><div class="v">${fmt(k,v)}</div><div class="l">${l}</div><div class="m">Avg ${fmt(k,a)}${raw}${extra}</div>
  <div class="mini"><div style="width:${w}%;background:${col(d.a)}"></div><i style="left:${(a-lo)/sp*100}%"></i></div></div>`}).join("");
 const fp=cfg.arch.map((l,i)=>{const v=d.sc[i],w=Math.min(Math.abs(v),2.2)/2.2*50;return`<div class="depth"><span>${esc(l)}</span><div class="trk"><i class="avg" style="left:50%"></i><div style="position:absolute;top:0;bottom:0;${v>=0?"left:50%":"right:50%"};width:${w}%;background:${col(l)}"></div></div><b>${v>0?"+":v<0?"−":""}${Math.abs(v).toFixed(1)}</b></div>`}).join("");
 if(!D._cd)D._cd=cfg.prof.labels.map((_,i)=>D.reduce((a,o)=>a+o.cd[i]/Math.max(1,o.cd.reduce((x,y)=>x+y,0)),0)/D.length*100);
 const ta=d.cd.reduce((a,b)=>a+b,0),mx=Math.max(...d.cd.map(c=>c/Math.max(1,ta)*100),...D._cd)*1.08;
 const cdh=cfg.prof.labels.map((l,i)=>{const p=ta?d.cd[i]/ta*100:0;return`<div class="depth"><span>${l}</span><div class="trk"><div style="width:${p/mx*100}%;background:${col(d.a)}"></div><i class="avg" style="left:${D._cd[i]/mx*100}%"></i></div><b>${p.toFixed(0)}%</b></div>`}).join("");
 const hl=h=>h<0?"at":"vs.",ne=h=>h===0?" (neutral)":"";
 const log=d.g.map(g=>{const pill=g.od==="FCS"?`<span class="pill">FCS</span>`:`<span class="pill${g.od<=25?" top":""}">#${g.od}</span>`,both=ok(g.e)&&ok(g.ea),diff=both?g.ea-g.e:0;
  return`<tr><td>${g.dt}</td><td>${hl(g.h)} ${esc(g.o)}${ne(g.h)}</td><td>${pill}</td>${cfg.log.row(g).map(c=>`<td class="num">${c}</td>`).join("")}<td class="num">${fmt("epa",g.e,"r")}</td><td class="num">${fmt("epa",g.ea,"j")} <span class="${diff>0.0005?"up":diff<-0.0005?"dn":""}">${diff>0.0005?"▲":diff<-0.0005?"▼":""}</span></td></tr>`}).join("");
 const bio=[d.b?esc(d.b)+".":"",cfg.depth(d)].filter(Boolean).join(" ");
 $("#card").innerHTML=`<p class="nm">${esc(d.n)}</p>
 <p class="meta"><span class="dot" style="background:${col(d.a)}"></span>${esc(d.lab)}, ${esc(d.t)} (${esc(d.c)}), ${games(d.gp)} <span class="tl">· <a href="../teams/index.html#team/${esc(encodeURIComponent(d.t))}">Team page →</a></span></p>${bio?`<p class="bio">${bio}</p>`:""}
 <div class="sched"><b>Schedule: ${ord(d.sosr)} toughest of ${N}</b><span class="note" style="margin:0">${cfg.sosTxt(d.sos)}</span></div>
 <p class="line">${adj?"Adjusted":"Raw"} line: ${cfg.line(d,V,adj)}</p>
 <div class="kpis">${kp}</div>
 <h3>Style fingerprint</h3><p class="note" style="margin-bottom:8px">How far each style score sits from the FBS average for his position. The center line is average.</p>${fp}
 <h3>${cfg.prof.t}</h3><p class="note" style="margin-bottom:8px">Share of ${ta} ${cfg.prof.unit} ${cfg.prof.how}.</p>${cdh}
 <h3>Game by game</h3><p class="note" style="margin-bottom:0">${cfg.log.note}</p>
 <div class="tw log"><table><thead><tr><th>Date</th><th>Opponent</th><th>${cfg.log.od}</th>${cfg.log.head.map(h=>`<th class="num">${h}</th>`).join("")}<th class="num">${cfg.log.e}</th><th class="num">Adjusted</th></tr></thead><tbody>${log}</tbody></table></div>`}
function select(k,scroll,smooth=true){S.sel=k;field(false);card();table(F());try{history.replaceState(null,"",`#${pos}/${encodeURIComponent(k)}`)}catch(e){}
 if(scroll)$("#card").scrollIntoView({behavior:RM||!smooth?"auto":"smooth",block:"start"})}

/* ---------- leaders ---------- */
function bars(rows){const k=S.metric,M=cfg.lead[k],box=$("#bars");$("#minnote").textContent="";
 if(!rows.length){box.innerHTML=`<p class="empty">No ${cfg.many} match these filters. Tap a highlighted filter to clear it.</p>`;$("#blegend").innerHTML="";return}
 let top,w,lab;
 if(k==="sos"){top=rows.slice().sort((a,b)=>a.sos-b.sos).slice(0,10);const hi=Math.max(...D.map(d=>d.sos)),lo=Math.min(...D.map(d=>d.sos));w=d=>(hi-d.sos)/((hi-lo)||1)*100;lab=d=>ord(d.sosr)}
 else{let pool=rows;const t=TY[k];
  if(t==="epa"||t==="pct"||t==="d1"){const vs=D.map(cfg.vol).sort((a,b)=>a-b),min=Math.round(vs[Math.floor(vs.length/2)]/2);pool=rows.filter(d=>cfg.vol(d)>=min);$("#minnote").textContent=`Rate leaders need at least ${min} ${cfg.volLbl}, half the median among ${cfg.many} shown.`}
  top=pool.slice().sort((a,b)=>val(b,k)-val(a,k)).slice(0,10);const vs=top.map(d=>val(d,k)),mx=Math.max(...vs),mn=Math.min(0,...vs);w=d=>(val(d,k)-mn)/((mx-mn)||1)*100;lab=d=>fmt(k,val(d,k))}
 $("#blegend").innerHTML=M.stack?M.stack.map(([,l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join(""):k==="sos"?`<span>Ranked by how stingy his opponents' ${cfg.sosWho} rate, among all ${D.length}.</span>`:"";
 box.innerHTML=top.map(d=>{let fill;
  if(M.stack){const tot=M.stack.reduce((a,[s])=>a+Math.max(0,val(d,s)),0)||1,W=w(d);fill=M.stack.map(([s,,c])=>`<div style="width:${W*Math.max(0,val(d,s))/tot}%;background:${c}"></div>`).join("")}
  else fill=`<div style="width:${Math.max(0,w(d))}%;background:${col(d.a)}"></div>`;
  return`<div class="bar"><div class="n" data-k="${esc(d.k)}" tabindex="0">${esc(d.n)}<small>${esc(d.t)}${cfg.tag(d)}${d.gp<3?`, ${games(d.gp)}`:""}</small></div><div class="trk">${fill}</div><div class="v">${lab(d)}</div></div>`}).join("");
 box.querySelectorAll(".n").forEach(e=>{e.onclick=()=>select(e.dataset.k,true);e.onkeydown=ev=>{if(ev.key==="Enter")select(e.dataset.k,true)}})}

/* ---------- archetype mix ---------- */
function mix(rows){const svg=$("#mix");svg.innerHTML="";const W=svg.clientWidth||400,rowH=42,cs=CF.filter(c=>G.c.has(c)&&D.some(d=>d.c===c)),H=cs.length*rowH+8;
 svg.setAttribute("height",H);svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
 const labs=cs.map((c,i)=>{const t=el("text",{x:0,y:i*rowH+26,fill:"var(--ink)","font-size":17,"font-weight":600},svg);t.textContent=c;return t});
 let tw=0;labs.forEach(t=>{try{tw=Math.max(tw,t.getComputedTextLength())}catch(e){tw=Math.max(tw,90)}});
 const lw=Math.ceil(Math.max(60,tw))+12,mx=Math.max(1,...CF.map(c=>D.filter(d=>d.c===c).reduce((s,d)=>s+d.as.length,0)));
 cs.forEach((c,i)=>{const yy=i*rowH+6;let x0=lw;
  cfg.arch.forEach(a=>{if(!S.a.has(a))return;const n=rows.filter(d=>d.c===c&&d.as.includes(a)).length;if(!n)return;const w=n/mx*(W-lw-4);
   const rc=el("rect",{x:x0,y:yy+4,width:Math.max(0,w-2),height:24,fill:col(a),rx:2},svg);el("title",{},rc).textContent=`${c}: ${n} ${a}${n>1?"s":""}`;
   if(w>18){const tt=el("text",{x:x0+w/2-1,y:yy+21,"text-anchor":"middle",fill:colT(a),"font-size":15,"font-weight":700},svg);tt.textContent=n}x0+=w})})}

/* ---------- full board ---------- */
function header(){$("#tbl thead").innerHTML="<tr>"+cfg.cols.map(([k,l,n])=>`<th data-k="${k}" class="${n?"num":k==="n"?"pn":""}" tabindex="0" scope="col">${l}</th>`).join("")+"</tr>";
 document.querySelectorAll("#tbl th").forEach(th=>{const go=()=>{const k=th.dataset.k,c=cfg.cols.find(x=>x[0]===k);if(S.sort===k)S.dir*=-1;else{S.sort=k;S.dir=c[2]?(c[3]?1:-1):1}table(F())};th.onclick=go;th.onkeydown=e=>{if(e.key==="Enter")go()}})}
function table(rows){const k=S.sort,sv=d=>{const v=val(d,k);return typeof v==="string"?v.toLowerCase():ok(v)?v:-Infinity};
 rows=rows.slice().sort((a,b)=>(sv(a)>sv(b)?1:sv(a)<sv(b)?-1:0)*S.dir);
 document.querySelectorAll("#tbl th").forEach(th=>th.dataset.k===k?th.setAttribute("aria-sort",S.dir>0?"ascending":"descending"):th.removeAttribute("aria-sort"));
 $("#tbl tbody").innerHTML=rows.map(d=>`<tr data-k="${esc(d.k)}" class="${d.k===S.sel?"hl":""}" tabindex="0">`+cfg.cols.map(([c,,n])=>{
  if(c==="n")return`<td class="pn"><span class="dot" style="background:${col(d.a)}"></span>${esc(d.n)}<small>${esc(d.t)}${cfg.tag(d)}${d.gp<3?`, ${games(d.gp)}`:""}</small></td>`;
  if(c==="lab")return`<td><span class="dot" style="background:${col(d.a)}"></span>${esc(d.lab)}</td>`;
  if(!n)return`<td>${esc(d[c])}</td>`;
  if(c==="gp"||c==="sosr")return`<td class="num">${d[c]}</td>`;
  return`<td class="num">${fmt(c,val(d,c))}</td>`}).join("")+"</tr>").join("")||`<tr><td colspan="${cfg.cols.length}" class="empty">No ${cfg.many} match these filters. Tap a highlighted filter to clear it.</td></tr>`;
 $("#tbl tbody").querySelectorAll("tr[data-k]").forEach(r=>{r.onclick=()=>select(r.dataset.k,true);r.onkeydown=e=>{if(e.key==="Enter")select(r.dataset.k,true)}})}

/* ---------- position tabs + render ---------- */
function render(animate){const r=F();$("#modehelp").textContent=G.mode==="j"?cfg.help:"Raw numbers are straight totals, with no credit or discount for the defenses faced.";
 $("#count").innerHTML=`<b>${r.length}</b> of ${D.length} ${cfg.many} shown`;
 field(animate);bars(r);mix(r);table(r);card()}
function setPos(p,push){if(p===pos)return;pos=p;cfg=P[p];D=ALL[p];
 if(!D._prep){D.forEach(d=>{d.weak=d.lab.includes("weak fit");d.as=d.weak?[d.a]:d.lab.split(" / ");d.a2=d.as[1]||null});D._prep=1}
 if(!ST[p])ST[p]={a:new Set(cfg.arch),view:Object.keys(cfg.views)[0],metric:cfg.metric,sort:"epa",dir:-1,sel:cfg.def(D).k};S=ST[p];
 document.querySelectorAll(".topnav button").forEach(b=>{const on=b.dataset.p===p;b.setAttribute("aria-selected",on);b.tabIndex=on?0:-1});
 $("#h1").textContent=cfg.h1;$("#sub").textContent=cfg.sub;document.title=`${cfg.h1}: 2026 ${cfg.full.toLowerCase()} through Week {{WEEK}}`;
 chips($("#fa"),cfg.arch,()=>S.a,1);
 tabset("#views",cfg.views,"view",()=>{$("#tip").style.opacity=0;field(true)});
 tabset("#tabs",cfg.lead,"metric",()=>bars(F()));
 $("#cardnote").textContent=`Pick a ${cfg.one}, or tap one anywhere on the page. Black ticks mark the average across all ${D.length} ${cfg.many} shown.`;
 $("#mixnote").textContent=`How each league's ${cfg.many} break down. Hybrids count toward both of their archetypes.`;
 $("#boardnote").textContent=`Tap a column to sort, or a row to load that ${cfg.one}'s card. Sched. ranks the ${cfg.sosWho} each ${cfg.one} has faced, 1 being the toughest. Scroll sideways for more columns.`;
 $("#foot").innerHTML=cfg.foot;$("#tip").style.opacity=0;
 header();pickList();$("#dots").innerHTML="";dots.clear();render(false);
 if(push){try{history.replaceState(null,"","#"+p)}catch(e){}}}
const NAV=[...document.querySelectorAll(".topnav button")];
NAV.forEach((b,i)=>{b.onclick=()=>{if(b.dataset.p!==pos){setPos(b.dataset.p,true);scrollTo(0,0)}};
 b.onkeydown=e=>{const j=e.key==="ArrowRight"?(i+1)%NAV.length:e.key==="ArrowLeft"?(i+NAV.length-1)%NAV.length:-1;if(j>=0){e.preventDefault();NAV[j].focus();NAV[j].click()}}});
chips($("#fc"),CF,()=>G.c,0);
function route(first){const h=(location.hash||"").slice(1),i=h.indexOf("/"),p=i<0?h:h.slice(0,i);let k=null;
 if(i>=0)try{k=decodeURIComponent(h.slice(i+1))}catch(e){}
 if(!P[p]){if(first)setPos("qb",false);return}
 setPos(p,false);if(k&&D.some(d=>d.k===k))select(k,true,!first)}
route(true);
addEventListener("hashchange",()=>route(false));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{field(false);mix(F())});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{field(false);mix(F())},120)});
</script></body></html>
