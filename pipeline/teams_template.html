<script>
const DATA=__DATA__;
const M=DATA.meta,T=DATA.teams,PL=DATA.players,GM=DATA.games,N=M.n_fbs,I={};M.stat.forEach((k,i)=>I[k]=i);
const CF=["ACC","Big 12","Big Ten","SEC","Independent"],P4=new Set(M.p4);
const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ord=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const ok=v=>v!=null&&!Number.isNaN(v),enc=encodeURIComponent;
const mn=s=>String(s).replace(/^-/,"−");
const n1=v=>ok(v)?mn((Math.abs(v)<0.05?0:v).toFixed(1)):"–";
const yd=v=>ok(v)?mn(String(Math.round(v)||0)):"–";
const sg=(v,d=1)=>ok(v)?(v>=0.05?"+":v<=-0.05?"−":"")+Math.abs(v).toFixed(d):"–";
const sg3=v=>ok(v)?(v>0.0005?"+":v<-0.0005?"−":"")+Math.abs(v).toFixed(3):"–";
const pct=p=>{const v=p<.5?100-Math.round((1-p)*100):Math.round(p*100);return v>=100?"&gt;99%":v<=0?"&lt;1%":v+"%"};   // complementary chances always sum to 100%; never a flat 0% or 100%

/* ---------- each team's games, in order ---------- */
const TG={};for(const[g,x]of Object.entries(GM))for(const t of[x.h,x.a])(TG[t]=TG[t]||[]).push(g);
for(const t in TG)TG[t].sort((a,b)=>GM[a].wk-GM[b].wk||GM[a].ts-GM[b].ts);
const nextG=t=>(TG[t]||[]).find(g=>!GM[g].done);
const lastG=t=>(TG[t]||[]).filter(g=>GM[g].done).pop();

/* ---------- team colors: accents only (stripes, dots, bars), checked for contrast in each theme ---------- */
const hexok=c=>typeof c==="string"&&/^#[0-9a-f]{6}$/i.test(c);
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lum=h=>{const c=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const okL=c=>hexok(c)&&lum(c)<=.62,okD=c=>hexok(c)&&lum(c)>=.045;
function acc(t,alt){const x=T[t]||{},cs=[x.col,x.col2];const pick=f=>{const a=cs.filter(f);return(alt?a[1]:a[0])||null};return{l:pick(okL),d:pick(okD)}}
const dist=(a,b)=>!a||!b?(a===b?0:999):Math.hypot(...rgb(a).map((v,i)=>v-rgb(b)[i]));
const tvar=c=>`--tl:${c.l||"var(--dim)"};--td:${c.d||"var(--dim)"}`;
const tv=t=>tvar(acc(t));
function pair(a,h){const A=acc(a),H=acc(h),B=acc(a,1);
 for(const m of["l","d"])if(dist(A[m],H[m])<90)A[m]=B[m]&&dist(B[m],H[m])>=90?B[m]:(H[m]?null:A[m]);
 return[tvar(A),tvar(H)]}

/* ---------- dates in Eastern time, AP style ---------- */

 const h=+o.hour,mi=o.minute,pm=/p/i.test(o.dayPeriod||""),top=mi==="00";
 const time=h===12&&top?(pm?"noon":"midnight"):`${h}${top?"":":"+mi} ${pm?"p.m.":"a.m."}`;
 return{dow:DOW[o.weekday]||o.weekday,date:`${MON[+o.month-1]} ${+o.day}`,time}}
const dateL=g=>{const w=when(g.ts);return`${w.dow}, ${w.date}`};
const dateS=g=>when(g.ts).date;

/* ---------- game helpers ---------- */

/* ---------- stat lines ---------- */

 if(S(s,"att")>=(proj?0.5:1))out.push(`${c(S(s,"cmp"))}/${c(S(s,"att"))}, ${y(S(s,"py"))} pass yds, ${c(S(s,"ptd"))} TD, ${c(S(s,"int"))} INT`);

function cell(c,P,A,mode){const[,k,ty,inv]=c;
 if(k==="ca"){const p=P?`${n1(S(P,"cmp"))}/${n1(S(P,"att"))}`:"–",a=A?`${S(A,"cmp")}/${S(A,"att")}`:"";

 let ar="";if(P){const d=A[i]-P[i],th=ty==="y"?Math.max(15,.35*P[i]):ty==="t"?1:Math.max(2,.35*P[i]);
  if(Math.abs(d)>=th){const up=d>0,good=inv?!up:up;ar=`<span class="ar ${good?"up":"dn"}" title="${up?"Above":"Below"} projection">${up?"▲":"▼"}</span>`}}

function side(g,t,st,mode){const pr=g.pr||{},bx=g.box||{},ids=[...new Set([...Object.keys(pr),...Object.keys(bx)])].filter(p=>PL[p]&&PL[p].t===t);

   .sort((a,b)=>((pr[b]?S(pr[b],G.vol):0)-(pr[a]?S(pr[a],G.vol):0))||((bx[b]?S(bx[b],G.vol):0)-(bx[a]?S(bx[a],G.vol):0)));

const vkv=g=>`<div><span>Vegas spread</span><b>${vspread(g)||`<span class="dim">–</span>`}</b></div><div><span>Vegas over/under</span><b>${vou(g)!=null?vou(g):`<span class="dim">–</span>`}</b></div>`;
function modelPanel(g,sa,sh){const m=g.m;

  <p>${esc(am>0?g.h:g.a)} won by ${Math.abs(am)}; the model had ${Math.abs(pm)<0.05?"an even game":`${esc(pm>0?g.h:g.a)} by ${Math.abs(pm).toFixed(1)}`}, a miss of ${miss.toFixed(1)} points. Total ${g.hs+g.as} vs. ${tot.toFixed(1)} projected.</p>
  ${vs?`<p>Vegas: ${vs}${vou(g)!=null?`, O/U ${vou(g)}`:""}${vf?`, so the Vegas favorite ${(vf===g.h)===(am>0)?"won":"lost"}`:""}.</p>`:""}</div>`}
 return`<div class="panel"><h2>Model</h2><p class="note" style="margin:0">${g.done?`Pregame projection, using games through Week ${m.asof}.`:`Projection using games through Week ${m.asof}.`}</p>
 <table class="pt"><thead><tr><th>Team</th><th class="num">Proj.</th>${fin?`<th class="num">Final</th>`:""}<th class="num">Win</th></tr></thead><tbody>${tr(g.a,sa,m.ap,1-m.wp,g.as)}${tr(g.h,sh,m.hp,m.wp,g.hs)}</tbody></table>
 <div class="wpl"><span>${esc(ab(g.a))}<b>${pct(1-m.wp)}</b></span><span><b>${pct(m.wp)}</b>${esc(ab(g.h))}</span></div>${wpbar(g,sa,sh)}
 <div class="kv"><div><span>Model spread</span><b>${mspread(g)}</b></div><div><span>Model total</span><b>${tot.toFixed(1)}</b></div>
 ${g.ln?vkv(g):""}</div>
 ${!g.ln?`<p class="note" style="margin:8px 0 0">No Vegas line in the data for this game${g.done?"":" yet"}.</p>`:""}${verdict}</div>`}

 <p class="gmeta">${dateL(g)} · ${timeL(g)}${g.v?` · ${esc(g.v)}`:""}${g.ns?" (neutral site)":""}</p>

 ${matchup(g.a,g.h,sa,sh)}${matchup(g.h,g.a,sh,sa)}${[g.a,g.h].filter(t=>!(T[t]||{}).fbs).map(t=>`<p class="note" style="margin:8px 0 0">${esc(t)} is an FCS team, so it has no FBS rank and no edge is called.</p>`).join("")}
 <p class="pw">Model power: ${[[g.a,sa],[g.h,sh]].map(([t])=>{const x=T[t]||{};return x.fbs?`<b>${esc(ab(t))} ${sg(x.pw)}</b>${x.pwr?` (${ord(x.pwr)})`:""}`:`<b>${esc(ab(t))}</b> unrated (FCS)`}).join(", ")}. Points better or worse than an average FBS team on a neutral field.</p></div></section>
 <section><h2>Players</h2>${legend}
 <div class="seg sidetabs" role="tablist" aria-label="Team">${[g.a,g.h].map(t=>`<button role="tab" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
 <div class="vs2">${[[g.a,sa],[g.h,sh]].map(([t,st])=>`<div class="side" data-t="${esc(t)}" role="tabpanel">${side(g,t,st,mode)}</div>`).join("")}</div></section>`;
 const want=GS.side&&[g.a,g.h].includes(GS.side)?GS.side:(isP4(g.a)||!isP4(g.h)?g.a:g.h);

 $$(".sidetabs button",V).forEach((b,i,all)=>{b.onclick=()=>{GS.side=b.dataset.t;setSide(b.dataset.t)};
  b.onkeydown=e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();const n=all[1-i];n.focus();n.click()}}});

/* ---------- player panel ---------- */
function openP(pid){const p=PL[pid];if(!p)return;const t=p.t,x=T[t]||{},s=p.st,gp=s[13];
 const tiles=[];
 if(S(s,"att")>0)tiles.push(["Passing",[[`${S(s,"cmp")}/${S(s,"att")}`,"Cmp/Att"],[yd(S(s,"py")),"Yds"],[S(s,"ptd"),"TD"],[S(s,"int"),"INT"],[S(s,"sk"),"Sacks"]]]);
 if(S(s,"car")>0)tiles.push(["Rushing",[[S(s,"car"),"Carries"],[yd(S(s,"ry")),"Yds"],[mn((S(s,"ry")/S(s,"car")).toFixed(1)),"Per carry"],[S(s,"rtd"),"TD"]]]);
 if(S(s,"tgt")>0)tiles.push(["Receiving",[[S(s,"tgt"),"Targets"],[S(s,"rec"),"Catches"],[yd(S(s,"recy")),"Yds"],[S(s,"rectd"),"TD"]]]);

  :`<p class="empty" style="padding:8px 0">No passing, rushing or receiving numbers in 2026 yet.</p>`;
 const nx=nextG(t),ng=nx&&GM[nx];let nb="";

/* ---------- footer: how the projections work ---------- */
function foot(){const a=M.acc||{},c=M.cal||{},c0=M.cal25||{},f=(v,d=1)=>ok(v)?(+v).toFixed(d):"–";
 const wk=a.wk0===a.wk1?`Week ${a.wk0}`:`Weeks ${a.wk0} to ${a.wk1}`,lineN=a.nv===a.games?`all ${a.games}`:`the ${a.nv} with a Vegas line`;
 const calT=(a.cal||[]).length?`<div class="tw"><table><thead><tr><th>Model's chance for the favorite</th><th class="num">Games</th><th class="num">Expected to win</th><th class="num">Actually won</th></tr></thead><tbody>${a.cal.map(r=>`<tr><td>${Math.round(r.lo*100)}–${Math.round(r.hi*100)}%</td><td class="num">${r.n}</td><td class="num">${f(r.exp)}%</td><td class="num">${f(r.won)}%</td></tr>`).join("")}</tbody></table></div>`:"";
 const pl=Object.values(a.pl||{}),plT=pl.length?`<div class="tw"><table><thead><tr><th>Stat</th><th class="num">Player-games</th><th class="num">Model error</th><th class="num">Season-average error</th><th class="num">Correlation</th></tr></thead><tbody>${pl.map(r=>`<tr><td>${esc(r.l)}</td><td class="num">${r.n}</td><td class="num">${f(r.m)}</td><td class="num">${f(r.b)}</td><td class="num">${ok(r.r)?(r.r/100).toFixed(2):"–"}</td></tr>`).join("")}</tbody></table></div>`:"";
 $("#foot").innerHTML=`<h2>How the projections work</h2>
 <p><b>Team ratings.</b> The same opponent-adjusted ratings behind the Players page: a ridge regression rates every offense and defense on EPA per play and other stats, controlling for opponents and home field, with blowout plays left out. For projections each team starts from last season split two ways: its conference's average carries over strongly from year to year, its standing within the conference much less (both measured from 2024 to 2025).</p>
 <p><b>Projected score.</b> Each team's points are its projected plays (from both teams' pace) times the league's points per play plus a scale factor (now ${f(c.scale,2)}) × its net EPA-per-play edge (its offense rating plus the opponent's defense rating plus home field), plus a league-tier adjustment, because scrimmage EPA misjudges how far apart Power 4, Group of 5 and FCS teams are. Win probability treats the actual margin as normally distributed around the projected margin with a standard deviation of ${f(c.sigma)} points. The scale, tier terms and spread were first fit by replaying the 2025 season week by week${c0.n?` (${c0.n} games; scale ${f(c0.scale,2)}, standard deviation ${f(c0.sigma)})`:""}, then updated with this season's completed games${c.n26?` (${c.n26} so far)`:""}, the 2025 fit counting as 100 games. A played game's projection uses only the games before its week.</p>
 <p><b>Player projections.</b> Team volume (plays × the team's pass rate; sacks from both teams' sack ratings) × the player's share of his team's pass attempts, carries and targets, with recent games counting more (a game's weight halves every 2 games back, and a game he missed counts as zero share) × his per-play efficiency: his opponent-adjusted rate, pulled toward the average for his position when the sample is small, plus the opponent's defensive rating and home field. Receivers' catches, yards and TDs are reconciled with the quarterbacks' so the two sides of the passing game agree.</p>
 <p><b>Track record.</b> Every played game from Week ${a.wk0} on has a true pregame projection: ratings, usage and player rates are rebuilt from earlier weeks only. Across ${a.games} games in ${wk}, the model picked the winner ${f(a.su)}% of the time${a.nv!==a.games?` (${f(a.m_su_v)}% on games with a line)`:""}; the Vegas favorite won ${f(a.v_su)}%. On ${lineN}, the model's average miss on the margin was ${f(a.mv_mae)} points against Vegas's ${f(a.v_mae)}, and on the total ${f(a.mvt_mae)} against ${f(a.vt_mae)}. Vegas is more accurate on games; the model's edge is that it projects every player. Win chances have been about as reliable as stated:</p>
 ${calT}
 <p>Player lines, against a baseline of each player's season average so far (error is the average miss; correlation is between projected and actual):</p>
 ${plT}
 <p><b>Limits.</b> No injury reports or depth-chart news, so a player who missed recent games is projected at a reduced share. No projection for Week 1. FCS opponents have little data. Special teams and turnovers aren't modeled separately. Projections are averages, not ceilings.</p>
 <p>Source is cfbfastR's 2026 play-by-play and ESPN's game rosters and box scores; dates and kickoff times are Eastern. Vegas lines are sportsdataverse's for played games and ESPN's current line for games not yet played. Games through {{THROUGH}}.</p>`}

foot();route(true);
